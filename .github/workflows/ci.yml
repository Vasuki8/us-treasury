name: Test, build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Refresh all official data, calendars and yield timing before deployment
        type: boolean
        default: false
  schedule:
    # After Treasury's usual 18:00 Eastern availability in both EST and EDT.
    - cron: '37 23 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep an active main deployment intact; superseded PR checks may be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  refresh:
    name: Refresh official data and calendars
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.publish.outputs.commit_sha }}
    steps:
      - name: Check out the exact starting commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Only this trusted main-branch job needs credentials for its snapshot push.
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Refresh official sources and retain verified BLS calendar on access denial
        run: npm run data:refresh -- --allow-cached-bls-calendar

      - name: Test the refreshed snapshot
        run: npm test

      - name: Build the refreshed application
        run: npm run build

      - name: Smoke test the refreshed build
        run: node scripts/check-build.mjs

      - name: Commit and push only the verified snapshot
        id: publish
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: node scripts/publish-snapshot.mjs

      - name: Record failed refresh
        if: failure()
        run: echo 'Refresh failed. The previous published snapshot remains in place. See the failed step for details.' >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify on Node ${{ matrix.node }}
    needs: refresh
    if: ${{ !cancelled() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    outputs:
      commit_sha: ${{ needs.refresh.outputs.commit_sha || github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.refresh.outputs.commit_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      # This application has no dependencies or lockfile, so no install is needed.
      - name: Run tests
        run: npm test

      - name: Build static application
        run: npm run build

      - name: Smoke test built application
        run: node scripts/check-build.mjs

      - name: Save static build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meridian-static-node-${{ matrix.node }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload verified GitHub Pages build
        if: vars.DEPLOY_TARGET != 'cloudflare' && github.ref == 'refs/heads/main' && matrix.node == '24' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    name: Deploy GitHub Pages
    needs: verify
    if: ${{ !cancelled() && needs.verify.result == 'success' && vars.DEPLOY_TARGET != 'cloudflare' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy verified static artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  deploy-cloudflare:
    name: Deploy Cloudflare
    needs: verify
    if: ${{ !cancelled() && needs.verify.result == 'success' && vars.DEPLOY_TARGET == 'cloudflare' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: cloudflare-production
      url: ${{ steps.deployment.outputs.deployment-url }}
    steps:
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN repository secret and CLOUDFLARE_ACCOUNT_ID repository variable before selecting Cloudflare."
            exit 1
          fi

      - name: Check out deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Download the verified Node 24 build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: meridian-static-node-24
          path: dist/

      - name: Deploy verified static assets
        id: deployment
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.3'
          packageManager: npm
          command: deploy --config wrangler.json

      - name: Verify the public deployment against its build
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment-url }}
        run: node scripts/check-live.mjs "$DEPLOYMENT_URL"
