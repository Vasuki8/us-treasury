name: Test, build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Refresh all official data, calendars and yield timing before deployment
        type: boolean
        default: false
      check_sources:
        description: Check all official collectors and retain diagnostics without publishing their data
        type: boolean
        default: false
      refresh_scope:
        description: Sources to capture when Refresh data is enabled
        type: choice
        options:
          - all
          - unemployment-cpi-debt
          - core-labor
        default: all
  schedule:
    # After Treasury's usual 18:00 Eastern availability in both EST and EDT.
    - cron: '37 23 * * *'
    # Catch a missed/delayed daily trigger; the guard skips completed captures.
    - cron: '17 0,1 * * *'
    # GDP/claims/CPI 08:30 Eastern post-release checks across both DST offsets.
    # Bounded retries remain best effort; schedule time does not verify a result.
    - cron: '47 12,13,14 * * 1-5'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep an active main deployment intact; superseded PR checks may be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source_health:
    name: Check all official sources without publishing
    if: github.event_name == 'workflow_dispatch' && inputs.check_sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the exact starting commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install locked collector dependency
        run: npm ci --ignore-scripts

      - name: Collect and validate source health without writing snapshots
        env:
          SOURCE_RETRY_ATTEMPTS: '3'
          BLS_API_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.BLS_API_KEY || '' }}
        run: node scripts/refresh-data.mjs --check-only

      - name: Retain per-source errors, coverage, warnings and receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: official-source-health
          path: source-health.json
          if-no-files-found: warn
          retention-days: 30

      - name: Retain safe attempted-source status
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: official-source-check-status
          path: source-attempt-status.json
          if-no-files-found: warn
          retention-days: 30

  publication_upkeep:
    name: Report publication evidence upkeep
    if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact starting commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install locked PDF collector dependency
        run: npm ci --ignore-scripts

      - name: Check approved scope and report new official candidates
        env:
          SOURCE_RETRY_ATTEMPTS: '3'
        run: node scripts/report-publication-upkeep.mjs

      - name: Retain the read-only upkeep report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-evidence-upkeep
          path: publication-upkeep.json
          if-no-files-found: warn
          retention-days: 30

  refresh_check:
    name: Check daily and supported release refresh objectives
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.check.outputs.required }}
      expected_refresh_at: ${{ steps.check.outputs.expected_refresh_at }}
      sources: ${{ steps.check.outputs.sources }}
      refresh_kind: ${{ steps.check.outputs.refresh_kind }}
    steps:
      - name: Check out the exact starting commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check all registered daily capture outcomes
        id: check
        # Only this explicit manual option forces a repeat of a completed run.
        run: node scripts/retry-command.mjs -- node scripts/check-release-refresh.mjs ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_data && '--force' || '' }} ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_data && (inputs.refresh_scope == 'core-labor' && '--sources=bls' || inputs.refresh_scope == 'unemployment-cpi-debt' && '--sources=bls,treasury,fiscal') || '' }}

  refresh:
    name: Refresh official data and calendars
    needs: refresh_check
    if: ${{ !cancelled() && needs.refresh_check.result == 'success' && needs.refresh_check.outputs.required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.publish.outputs.commit_sha }}
    steps:
      - name: Check out the exact starting commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Only this trusted main-branch job needs credentials for its snapshot push.
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install locked data-collector dependencies
        run: npm ci --ignore-scripts

      - name: Refresh healthy sources and clearly retain verified BLS statistics during service failure
        env:
          SOURCE_RETRY_ATTEMPTS: '3'
          BLS_API_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.BLS_API_KEY || '' }}
        run: npm run data:refresh -- ${{ needs.refresh_check.outputs.sources && format('--allow-cached-bls --sources={0}', needs.refresh_check.outputs.sources) || '--allow-cached-bls' }}

      - name: Test the refreshed snapshot
        run: node scripts/retry-command.mjs -- npm test

      - name: Build the refreshed application
        run: node scripts/retry-command.mjs -- npm run build

      - name: Smoke test the refreshed build
        run: node scripts/retry-command.mjs -- node scripts/check-build.mjs

      - name: Commit and push only the verified snapshot
        id: publish
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          UPDATE_RETRY_ATTEMPTS: '3'
        run: node scripts/publish-snapshot.mjs

      - name: Record failed refresh
        if: failure()
        run: echo 'Refresh failed. The previous published snapshot remains in place. See the failed step for details.' >> "$GITHUB_STEP_SUMMARY"

      - name: Retain safe attempted-source status
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: official-refresh-status
          path: source-attempt-status.json
          if-no-files-found: warn
          retention-days: 30

  verify:
    name: Verify on Node ${{ matrix.node }}
    needs: [refresh_check, refresh]
    if: ${{ !cancelled() && (needs.refresh_check.result == 'success' || needs.refresh_check.result == 'skipped') && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped') && (github.event_name != 'schedule' || needs.refresh.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    outputs:
      commit_sha: ${{ needs.refresh.outputs.commit_sha || github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.refresh.outputs.commit_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked data-collector dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: node scripts/retry-command.mjs -- npm test

      - name: Build static application
        run: node scripts/retry-command.mjs -- npm run build

      - name: Smoke test built application
        run: node scripts/retry-command.mjs -- node scripts/check-build.mjs

      - name: Save static build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meridian-static-node-${{ matrix.node }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload verified GitHub Pages build
        if: vars.DEPLOY_TARGET != 'cloudflare' && github.ref == 'refs/heads/main' && matrix.node == '24' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    name: Deploy GitHub Pages
    needs: verify
    if: ${{ !cancelled() && needs.verify.result == 'success' && vars.DEPLOY_TARGET != 'cloudflare' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy_first.outcome == 'success' && steps.deploy_first.outputs.page_url || steps.deploy_second.outcome == 'success' && steps.deploy_second.outputs.page_url || steps.deploy_third.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy verified static artifact (attempt 1)
        id: deploy_first
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: '600000'

      - name: Wait before the second deployment attempt
        if: "!cancelled() && steps.deploy_first.outcome == 'failure'"
        run: sleep 5

      - name: Deploy verified static artifact (attempt 2)
        id: deploy_second
        if: "!cancelled() && steps.deploy_first.outcome == 'failure'"
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: '600000'

      - name: Wait before the last deployment attempt
        if: "!cancelled() && steps.deploy_second.outcome == 'failure'"
        run: sleep 30

      - name: Deploy verified static artifact (attempt 3)
        id: deploy_third
        if: "!cancelled() && steps.deploy_second.outcome == 'failure'"
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: '600000'

  deploy-cloudflare:
    name: Deploy Cloudflare
    needs: verify
    if: ${{ !cancelled() && needs.verify.result == 'success' && vars.DEPLOY_TARGET == 'cloudflare' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    environment:
      name: cloudflare-production
      url: ${{ steps.deploy_first.outcome == 'success' && steps.deploy_first.outputs.deployment-url || steps.deploy_second.outcome == 'success' && steps.deploy_second.outputs.deployment-url || steps.deploy_third.outputs.deployment-url }}
    steps:
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN repository secret and CLOUDFLARE_ACCOUNT_ID repository variable before selecting Cloudflare."
            exit 1
          fi

      - name: Check out deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Download the verified Node 24 build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: meridian-static-node-24
          path: dist/

      - name: Deploy verified static assets (attempt 1)
        id: deploy_first
        timeout-minutes: 10
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.3'
          packageManager: npm
          command: deploy --config wrangler.json

      - name: Wait before the second deployment attempt
        if: "!cancelled() && steps.deploy_first.outcome == 'failure'"
        run: sleep 5

      - name: Deploy verified static assets (attempt 2)
        id: deploy_second
        if: "!cancelled() && steps.deploy_first.outcome == 'failure'"
        timeout-minutes: 10
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.3'
          packageManager: npm
          command: deploy --config wrangler.json

      - name: Wait before the last deployment attempt
        if: "!cancelled() && steps.deploy_second.outcome == 'failure'"
        run: sleep 30

      - name: Deploy verified static assets (attempt 3)
        id: deploy_third
        if: "!cancelled() && steps.deploy_second.outcome == 'failure'"
        timeout-minutes: 10
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.3'
          packageManager: npm
          command: deploy --config wrangler.json

      - name: Verify the public deployment against its build
        env:
          DEPLOYMENT_URL: ${{ steps.deploy_first.outcome == 'success' && steps.deploy_first.outputs.deployment-url || steps.deploy_second.outcome == 'success' && steps.deploy_second.outputs.deployment-url || steps.deploy_third.outputs.deployment-url }}
        run: node scripts/retry-command.mjs -- node scripts/check-live.mjs "$DEPLOYMENT_URL"
